[project]
name = "apex-commons"
version = "2026.10.0"
description = "Core runtime and orchestration framework for apex.ermnvldmr.com node fleet"
readme = "README.md"
license = { text = "BSD-2-Clause" }
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S603", "S607"]  # Subprocess invocations are mediated via ctx.sys

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
